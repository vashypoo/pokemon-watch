name: Toy Kingdom watch

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency: tk-watch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the store
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py
      - name: Save results
        run: |
          git config user.name "tk-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "check $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
